# Modified from revfactory/harness (Apache-2.0, Copyright 2025 robin).
# Upstream PR #55 contributed the plugin/skill validation gate and PR #56 the
# JSON + conflict-marker scan. This version merges the two workflows into one,
# fixes a false positive in the conflict-marker scan, and adds the guardrail
# that proves each gate fails on a broken tree.
#
# One job, one command. Listing the gates here as separate steps let this file
# and scripts/preflight.sh drift, and then a green tick meant "the gates CI
# knows about passed" rather than "the gates passed". The `ci-runs-preflight`
# repository gate checks that this file still calls the script.
name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight — every gate, and proof each one fails on broken input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the change-notice gate cross-checks against the baseline commit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A green pipeline says this tree is clean. It does not say the gates
      # would catch a dirty one — the guardrail suite inside preflight answers
      # that second question by breaking each rule on purpose.
      - name: scripts/preflight.sh
        run: bash scripts/preflight.sh
