blank_issues_enabled: false
contact_links:
  - name: GitHub Discussions — open-ended questions & RFCs
    url: https://github.com/IISweetHeartII/oh-my-harness/discussions
    about: Design discussions, ideas, and anything not yet actionable as an issue.
  - name: Security disclosure (private)
    url: https://github.com/IISweetHeartII/oh-my-harness/security/advisories/new
    about: Report vulnerabilities privately through GitHub Security Advisories. Do not open a public issue.
  - name: Upstream project (revfactory/harness)
    url: https://github.com/revfactory/harness
    about: This project is a derivative. Issues in upstream's own releases belong there, not here.
